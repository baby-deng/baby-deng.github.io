<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="医疗岗位资料平台登录">
    <title>登录｜医疗岗位资料平台</title>
    <link rel="stylesheet" href="./styles.css?v=9">
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-story" aria-label="平台介绍">
        <div class="login-brand"><span class="brand-mark">医</span><strong>医疗岗位资料平台</strong></div>
        <div class="login-story-copy">
          <p class="eyebrow">DXY HEADHUNTING</p>
          <h1>让每一个岗位，<br>都有完整的介绍依据。</h1>
          <p>城市、医院、科室和岗位资料集中保存，登录后可在不同设备继续使用。</p>
        </div>
        <div class="login-feature-row">
          <span>云端资料库</span><span>自动保存</span><span>独立岗位链接</span>
        </div>
      </section>

      <section class="login-panel">
        <form class="login-card" id="login-form">
          <p class="eyebrow">SECURE ACCESS</p>
          <h2>登录资料平台</h2>
          <p class="login-intro">使用您的个人账号进入岗位资料库。</p>

          <label class="login-field">
            <span>登录账号</span>
            <input id="login-username" name="username" type="email" autocomplete="username" placeholder="请输入现有人才库登录邮箱" required autofocus>
          </label>
          <label class="login-field">
            <span>登录密码</span>
            <input name="password" type="password" autocomplete="current-password" required>
          </label>
          <p class="login-error" id="login-error" role="alert"></p>
          <button class="primary-button login-submit" type="submit">登录平台</button>
          <p class="login-security">与现有人才库共用 Supabase 登录账号，资料仅本人可见。</p>
        </form>
      </section>
    </main>
    <script src="./vendor/supabase.min.js?v=2.49.4"></script>
    <script src="./config.js?v=1"></script>
    <script src="./cloud.js?v=1"></script>
    <script src="./login.js?v=9"></script>
  </body>
</html>
